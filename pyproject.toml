[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vnnli-engram-moe"
version = "0.1.0"
description = "Fine-tuning toolkit for Vietnamese natural language inference baselines and future MoE research."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
  { name = "DangKhoaAI" }
]
dependencies = [
  "datasets>=2.21.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "pyyaml>=6.0.0",
  "torch>=2.10.0",
  "tqdm>=4.66.0",
  "transformers>=5.0.0",
]

[project.optional-dependencies]
dev = [
  "ipykernel>=6.29.0",
  "nbformat>=5.10.0",
  "pytest>=8.2.0",
  "ruff>=0.6.0",
]

[project.scripts]
vnnli-cli = "vnnli_engram_moe.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

